<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D0 Trading Challenge · sign up</title>
<link rel="stylesheet" href="../assets/css/poster.css">
<style>
  /* Figma: Twitter post - 6 · 675 × 1200 */
  .poster { width: 675px; height: 1200px; }
</style>
</head>
<body>

<div class="poster" id="poster">
  <!-- The plate is the Figma node render, so its progressive bottom blur is baked in.
       It sits 55.25px outside the rectangle on every side, which is the blur bleed. -->
  <img class="plate" src="../assets/img/03-signup-bg.webp" alt=""
       style="left:-79.25px; top:-55.25px; width:860.5px; height:1332.5px">

  <div class="tint" style="left:-24px; top:0; width:751px; height:1222px;
       background:linear-gradient(180deg, #C88D58 11.364%, #8E40EB 61.647%, #3052F2 100%)"></div>

  <p class="t serif" style="left:49px; top:491px; width:560px; font-size:76px; line-height:98.8px;
       text-align:center; -webkit-text-stroke-width:2px; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.5))">D0 Trading Challenge</p>

  <p class="t sans" style="left:64px; top:583px; width:545px; font-size:32px; line-height:41.6px;
       letter-spacing:-1.6px; text-align:center; font-weight:700"><span style="color:#E3D1FF">Sign up</span> and get <span style="color:#E3D1FF">50 USDT</span> in trial funds,
on us</p>

  <img src="../assets/brand/donut-lockup-white.svg" alt="Donut"
       style="left:239px; top:1069px; width:195.6px; height:64px">

  <!-- blurred mask that knocks the sky back behind the type -->
  <div class="blob" style="left:260px; top:242px; width:146px; height:142px;
       background:#181A14; filter:blur(38.6px)"></div>
</div>

</body>
</html>
